<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>峻峻的作品馆</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="作品馆">
<meta name="theme-color" content="#faf7f2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon.png">
<style>
  :root {
    --bg: #faf7f2;
    --bg-2: #f1e9de;
    --ink: #2b2620;
    --ink-soft: #7a7168;
    --accent: #c8622a;
    --accent-soft: #f6ede2;
    --card: #ffffff;
    --line: rgba(43, 38, 32, .09);
    --radius: 22px;
    --tap: 52px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100dvh;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding:
      calc(env(safe-area-inset-top, 0px) + 22px)
      calc(env(safe-area-inset-right, 0px) + 20px)
      calc(env(safe-area-inset-bottom, 0px) + 34px)
      calc(env(safe-area-inset-left, 0px) + 20px);
    overflow-x: hidden;
  }
  /* 页头：左＝标题（带装饰面），右＝刷新按钮，与网格右边缘对齐 */
  header {
    max-width: 1280px;
    margin: 0 auto 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: clamp(12px, 2vw, 24px);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: clamp(10px, 1.4vw, 14px);
    min-width: 0;
  }
  /* 装饰面：藏书印风格的圆角方块，内嵌一本翻开的书 */
  .brand-mark {
    flex: none;
    width: clamp(40px, 5vw, 50px);
    height: clamp(40px, 5vw, 50px);
    border-radius: clamp(12px, 1.5vw, 15px);
    background: linear-gradient(148deg, #dd8447 0%, #c8622a 52%, #a84b1c 100%);
    color: #fff;
    display: grid;
    place-items: center;
    box-shadow:
      0 10px 20px -10px rgba(150, 70, 25, .85),
      inset 0 1px 0 rgba(255, 255, 255, .42),
      inset 0 -1px 0 rgba(88, 38, 8, .28);
  }
  .brand-mark svg { width: 56%; height: 56%; }
  h1 {
    position: relative;
    margin: 0 0 2px;
    padding-bottom: 8px;
    font-size: clamp(1.45rem, 3.4vw, 2.1rem);
    line-height: 1.15;
    font-weight: 700;
    letter-spacing: .02em;
    color: var(--ink);
  }
  /* 标题下的收锋笔触：从实到虚，收在字的右端 */
  h1::after {
    content: "";
    position: absolute;
    left: 1px;
    right: 4px;
    bottom: 0;
    height: 5px;
    border-radius: 999px;
    background: linear-gradient(90deg,
      var(--accent) 0%,
      rgba(200, 98, 42, .62) 46%,
      rgba(200, 98, 42, .22) 78%,
      rgba(200, 98, 42, 0) 100%);
  }
  .refresh {
    flex: none;
    width: 52px;
    height: 52px;
    border: 0;
    border-radius: 50%;
    background: #fffdf8;
    color: var(--accent);
    box-shadow:
      0 2px 10px rgba(43, 38, 32, .15),
      inset 0 0 0 1px var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .refresh:active { transform: scale(.93); }
  .refresh svg { width: 23px; height: 23px; }
  /* 刷新反馈：仅装饰，不参与任何显隐逻辑，冻结也无副作用 */
  .refresh.is-busy { background: var(--accent); color: #fff; }
  .refresh.is-busy svg { animation: spin .55s linear; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  /* 内嵌阅读层：作品在页内打开，返回按钮由作品馆自己控制，不依赖浏览器导航
     （同样不做淡入动画，保证点击后立刻可见） */
  .reader {
    position: fixed;
    inset: 0;
    z-index: 80;
    background: #fffdfa;
  }
  .reader iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #fff;
  }
  .reader-back {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: calc(env(safe-area-inset-left, 0px) + 12px);
    z-index: 2;
    width: 78px;
    height: 78px;
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, .94);
    color: var(--accent);
    box-shadow: 0 4px 18px rgba(43, 38, 32, .3);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .reader-back:active { transform: scale(.93); }
  .reader-back svg { width: 42px; height: 42px; }
  .reader-open {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 22px);
    right: calc(env(safe-area-inset-right, 0px) + 16px);
    z-index: 2;
    width: 56px;
    height: 56px;
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, .86);
    color: var(--ink-soft);
    box-shadow: 0 3px 12px rgba(43, 38, 32, .22);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .reader-open:active { transform: scale(.93); }
  .reader-open svg { width: 26px; height: 26px; }

  .grid {
    max-width: 1280px;
    margin: 0 auto;
    display: grid;
    gap: clamp(14px, 2vw, 22px);
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  @media (min-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 1360px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

  .card {
    position: relative;
    background: #fffdf8;
    border-radius: 10px;
    overflow: hidden;
    /* 底部四层错位阴影 = 书页堆叠的书口厚度 */
    box-shadow:
      0 1px 2px rgba(43, 38, 32, .22),
      0 20px 32px -18px rgba(43, 38, 32, .58),
      0 3px 0 -1px #fffdf8,
      0 7px 0 -2px #f2e9da,
      0 11px 0 -3px #e6dbc7,
      0 15px 0 -4px #d9cbb2;
  }
  .card-open {
    display: block;
    color: inherit;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .card-open:active { transform: scale(.985); }
  .card-open, .card-open * { transition: transform .12s ease; }
  .thumb {
    position: relative;
    aspect-ratio: 3 / 4;
    background: var(--accent-soft);
    overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 书脊：左边缘的暗部渐变 */
  .thumb::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 20px;
    z-index: 2;
    background: linear-gradient(90deg,
      rgba(32, 21, 9, .62) 0,
      rgba(38, 26, 12, .34) 42%,
      rgba(38, 26, 12, .1) 72%,
      rgba(255, 255, 255, 0) 100%);
    box-shadow: inset -1px 0 0 rgba(255, 255, 255, .38);
  }
  /* 书口：右边缘的纸页纹 */
  .thumb::after {
    content: "";
    position: absolute;
    inset: 0 0 0 auto;
    width: 16px;
    z-index: 2;
    background: repeating-linear-gradient(180deg, #fffdf8 0 3px, #e9ddc9 3px 4px);
    box-shadow: inset 4px 0 6px rgba(60, 45, 25, .22);
  }
  .thumb-empty {
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft); font-size: 2.4rem;
  }
  /* 书名：叠在封面左上角，省掉下方整条信息栏（创作时间已移到卡片右下角、二维码左侧） */
  .caption {
    position: absolute;
    z-index: 3;
    left: 26px;
    top: 16px;
    /* 只避让右侧书口（16px），不再按二维码按钮留 64px ——
       二维码在卡片右下角，跟顶部这块不冲突，留太多会把书名挤到折行 */
    right: 34px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
  }
  .caption h2 {
    margin: 0;
    font-size: clamp(.95rem, 1.9vw, 1.15rem);
    line-height: 1.25;
    font-weight: 600;
    color: var(--ink);
    background: rgba(255, 253, 248, .84);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    border-radius: 10px;
    padding: 6px 11px;
    box-shadow: 0 1px 5px rgba(43, 38, 32, .14);
  }

  /* 卡片右下角一行：[创作时间] [二维码按钮]，紧贴右边缘（避让 16px 书口） */
  .card-foot {
    position: absolute;
    z-index: 3;
    right: 22px;
    bottom: 18px;
    max-width: calc(100% - 34px);
    display: flex;
    align-items: center;
    gap: 9px;
  }
  /* 创作时间：小字、无衬底，靠白晕保证压在插画上也读得清 */
  .card-foot time {
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .015em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    color: #241f19;
    text-shadow:
      0 1px 0 rgba(255, 255, 255, .96),
      0 0 4px rgba(255, 255, 255, .96),
      0 0 9px rgba(255, 255, 255, .88);
  }

  .qr-btn {
    flex: none;
    width: var(--tap);
    height: var(--tap);
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, .94);
    box-shadow: 0 2px 10px rgba(43, 38, 32, .17);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .qr-btn:active { transform: scale(.94); }
  .qr-btn svg { width: 18px; height: 18px; }

  /* 整个作品馆的二维码：固定在画面右下角 */
  .site-qr {
    position: fixed;
    right: calc(env(safe-area-inset-right, 0px) + 22px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    z-index: 45;
    width: 64px;
    height: 64px;
    border: 0;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    box-shadow: 0 8px 22px -6px rgba(120, 60, 20, .55);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .site-qr:active { transform: scale(.93); }
  .site-qr svg { width: 30px; height: 30px; }

  /* 二维码浮层（不做淡入动画：过渡在后台/异常环境下会被冻结，出现"点了不出来"） */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(30, 26, 22, .5);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding:
      calc(env(safe-area-inset-top, 0px) + 20px)
      20px
      calc(env(safe-area-inset-bottom, 0px) + 20px);
  }
  .sheet {
    position: relative;
    width: min(92vw, 420px);
    max-height: 100%;
    overflow: auto;
    background: #fffdfa;
    border-radius: 26px;
    padding: 26px 24px 22px;
    text-align: center;
    box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .5);
  }
  .sheet h3 { margin: 0 0 16px; font-size: 1.18rem; line-height: 1.35; }
  .qr-frame {
    background: #f7f5f0;
    border-radius: 18px;
    padding: 14px;
    display: inline-block;
    line-height: 0;
    margin-bottom: 14px;
  }
  .qr-frame img {
    width: min(60vw, 300px);
    height: auto;
    display: block;
    image-rendering: crisp-edges;
  }
  .close-x {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 52px;
    height: 52px;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font-size: 1.7rem;
    line-height: 1;
    cursor: pointer;
    border-radius: 50%;
    -webkit-tap-highlight-color: transparent;
  }
  .close-x:active { background: var(--accent-soft); }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 54px;
    padding: 0 26px;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { filter: brightness(.94); }
  .empty { color: var(--ink-soft); text-align: center; padding: 8vh 0; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 6.4C10.6 5 8.6 4.3 6.2 4.3H3.8v13.4h2.4c2.4 0 4.4.7 5.8 2.1 1.4-1.4 3.4-2.1 5.8-2.1h2.4V4.3h-2.4c-2.4 0-4.4.7-5.8 2.1z"/>
        <path d="M12 6.4v13.4"/>
      </svg>
    </span>
    <h1>峻峻的作品馆</h1>
  </div>
  <button class="refresh" id="refresh" type="button" aria-label="刷新作品列表">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3.8 12a8.2 8.2 0 0 1 14-5.8"/>
      <path d="M18.2 3.4v4.4h-4.4"/>
      <path d="M20.2 12a8.2 8.2 0 0 1-14 5.8"/>
      <path d="M5.8 20.6v-4.4h4.4"/>
    </svg>
  </button>
</header>

<main id="grid" class="grid" aria-live="polite"></main>

<button class="site-qr" id="site-qr" aria-label="显示作品馆二维码" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/>
    <rect x="3" y="14" width="7" height="7" rx="1.6"/><path d="M14 14h3v3h-3z"/>
    <path d="M19.5 14H21v1.5"/><path d="M14 19.5V21h1.5"/><path d="M19.5 19.5H21V21"/>
  </svg>
</button>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="qr-title" hidden>
  <div class="sheet">
    <button class="close-x" id="qr-x" aria-label="关闭二维码">×</button>
    <h3 id="qr-title">作品</h3>
    <div class="qr-frame"><img id="qr-img" alt="作品二维码"></div>
    <button class="btn" id="qr-close">关闭</button>
  </div>
</div>

<div class="reader" id="reader" hidden>
  <iframe id="reader-frame" title="作品内容" allow="autoplay; fullscreen; accelerometer; gyroscope" allowfullscreen></iframe>
  <button class="reader-back" id="reader-back" aria-label="回到作品馆">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
  </button>
  <button class="reader-open" id="reader-external" aria-label="在浏览器中打开这个作品">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 19V8a1.5 1.5 0 0 1 1.5-1.5H10"/></svg>
  </button>
</div>

<script>
(function () {
  "use strict";
  var grid = document.getElementById("grid");
  var overlay = document.getElementById("overlay");
  var qrImg = document.getElementById("qr-img");
  var qrTitle = document.getElementById("qr-title");
  var lastTrigger = null;

  var QR_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/>'
    + '<rect x="3" y="14" width="7" height="7" rx="1.6"/><path d="M14 14h3v3h-3z"/><path d="M19.5 14H21v1.5"/>'
    + '<path d="M14 19.5V21h1.5"/><path d="M19.5 19.5H21V21"/></svg>';

  function openQr(work, trigger) {
    lastTrigger = trigger || null;
    qrTitle.textContent = work.title;
    qrImg.src = work.qr;
    qrImg.alt = work.title + " 二维码";
    overlay.hidden = false;
    document.getElementById("qr-close").focus({ preventScroll: true });
  }

  function closeQr() {
    if (overlay.hidden) return;
    overlay.hidden = true;
    qrImg.removeAttribute("src");
    if (lastTrigger && document.contains(lastTrigger)) lastTrigger.focus({ preventScroll: true });
  }

  document.getElementById("qr-close").addEventListener("click", closeQr);
  document.getElementById("qr-x").addEventListener("click", closeQr);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeQr(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeQr(); });

  /* ---------- 内嵌阅读层 ----------
     作品在页内打开，左上角一个显性的大返回按钮。
     不依赖浏览器导航栏 —— 加到主屏后是全屏无地址栏的，小朋友靠浏览器返回键回不来。 */
  var reader = document.getElementById("reader");
  var frame = document.getElementById("reader-frame");
  var readerUrl = "";

  /* 绘本页看到这个 hash 会跳过自己的封面页，直接进故事正文 ——
     书名已经叠在卡片上了，再走一遍封面是多余的。
     单独扫码或直接打开链接时不带这个 hash，照旧先显示封面。
     用 hash 而不是 query：豆包对不带尾斜杠的地址做 301，会丢掉 search，只有 hash 能活着到达页面。 */
  var ENTRY_HASH = "#from-gallery";
  function withEntryFlag(url) {
    if (!url) return url;
    return url.split("#")[0] + ENTRY_HASH;
  }

  function openReader(work) {
    readerUrl = work.onlineUrl || work.localUrl;
    frame.src = withEntryFlag(readerUrl);
    reader.hidden = false;
    document.body.style.overflow = "hidden";
    document.getElementById("reader-back").focus({ preventScroll: true });
  }

  function closeReader() {
    if (reader.hidden) return;
    reader.hidden = true;
    frame.removeAttribute("src"); // 断开引用，把里面的声音一起停掉
    readerUrl = "";
    document.body.style.overflow = "";
  }

  document.getElementById("reader-back").addEventListener("click", closeReader);
  /* 「在浏览器中打开」算单独进入：给不带 hash 的原始地址，让作品页正常显示封面 */
  document.getElementById("reader-external").addEventListener("click", function () {
    if (readerUrl) window.open(readerUrl, "_blank", "noopener");
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeReader(); });

  /* 右下角的整馆二维码：扫一次直接进作品馆 */
  var siteQrEl = document.getElementById("site-qr");
  var siteQrPath = "";
  siteQrEl.addEventListener("click", function () {
    if (!siteQrPath) return;
    openQr({ title: "峻峻的作品馆", qr: siteQrPath, onlineUrl: "" }, siteQrEl);
  });

  function card(work) {
    var el = document.createElement("article");
    el.className = "card";

    var link = document.createElement("a");
    link.className = "card-open";
    // 线上优先：iPad 与本机不在同一个 Wi-Fi，所以作品统一走公网地址。
    // href + target 只作为兜底（JS 失效时长按或新窗口仍能打开），正常点击走页内阅读层。
    link.href = work.onlineUrl || work.localUrl;
    link.target = "_blank";
    link.rel = "noopener";
    link.setAttribute("aria-label", "打开《" + work.title + "》");
    link.addEventListener("click", function (e) {
      e.preventDefault();
      openReader(work);
    });

    var thumb = document.createElement("div");
    thumb.className = "thumb";
    if (work.cover) {
      var img = document.createElement("img");
      img.src = work.cover;
      img.alt = "";
      img.loading = "lazy";
      thumb.appendChild(img);
    } else {
      thumb.classList.add("thumb-empty");
      thumb.textContent = "◆";
    }

    var caption = document.createElement("div");
    caption.className = "caption";
    var h2 = document.createElement("h2");
    h2.textContent = work.title;
    caption.appendChild(h2);
    thumb.appendChild(caption);

    link.appendChild(thumb);
    el.appendChild(link);

    /* 右下角一行：创作时间在二维码按钮左侧（时间无衬底，靠白晕压在插画上） */
    var foot = document.createElement("div");
    foot.className = "card-foot";
    if (work.created) {
      var when = document.createElement("time");
      when.textContent = work.created;
      foot.appendChild(when);
    }
    if (work.qr) {
      var btn = document.createElement("button");
      btn.className = "qr-btn";
      btn.type = "button";
      btn.innerHTML = QR_ICON;
      btn.setAttribute("aria-label", "显示《" + work.title + "》的二维码");
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        openQr(work, btn);
      });
      foot.appendChild(btn);
    }
    el.appendChild(foot);
    return el;
  }

  function render(data) {
    var works = data.works || [];
    siteQrPath = data.siteQr || "";
    siteQrEl.hidden = !siteQrPath;
    grid.textContent = "";
    if (!works.length) {
      var p = document.createElement("p");
      p.className = "empty";
      p.textContent = "还没有作品，先让豆包做一本吧。";
      grid.appendChild(p);
      return;
    }
    var frag = document.createDocumentFragment();
    works.forEach(function (w) { frag.appendChild(card(w)); });
    grid.appendChild(frag);
  }

  /* bust=true 时带时间戳绕开缓存 —— 刷新按钮的落点 */
  function load(bust) {
    var url = "works.json" + (bust ? "?t=" + Date.now() : "");
    return fetch(url, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(render)
      .catch(function (err) {
        grid.textContent = "";
        var p = document.createElement("p");
        p.className = "empty";
        p.textContent = "作品列表没读出来（" + err.message + "），确认服务在跑，然后刷新一下。";
        grid.appendChild(p);
      });
  }

  /* 首屏刷新按钮：加到主屏后没有地址栏，下拉刷新不可用，只能给个显式按钮 */
  var refreshBtn = document.getElementById("refresh");
  refreshBtn.addEventListener("click", function () {
    if (refreshBtn.classList.contains("is-busy")) return;
    refreshBtn.classList.add("is-busy");
    setTimeout(function () { refreshBtn.classList.remove("is-busy"); }, 700);
    closeReader();
    closeQr();
    grid.style.opacity = ".45";
    load(true).then(function () { grid.style.opacity = ""; });
  });

  load(false);
})();
</script>
</body>
</html>
