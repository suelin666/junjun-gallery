<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>峻峻的作品馆</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="作品馆">
<meta name="theme-color" content="#faf7f2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon.png">
<style>
  :root {
    --bg: #faf7f2;
    --bg-2: #f1e9de;
    --ink: #2b2620;
    --ink-soft: #7a7168;
    --accent: #c8622a;
    --accent-soft: #f6ede2;
    /* 书签专用的一对：淡橙底 + 其上的深橙数字。
       只给序号书签用 —— 它需要「有一点颜色」但仍是配角。
       数字必须用 --accent-deep 而不是 --accent：橙色数字落在淡橙底上
       对比度只有 3.35:1，小字偏弱；换成深橙后实测 4.75:1，
       过小字 4.5:1 门槛但余量不大 —— 这条线不要再往下调。 */
    --accent-tint: #f8e8d8;
    --accent-deep: #a84b1c;
    --card: #ffffff;
    --line: rgba(43, 38, 32, .09);
    --radius: 22px;
    --tap: 52px;
    /* 整馆二维码（固定在画面右下角）的尺寸与边距。
       抽成变量是为了让「页面底部留白」能跟着它算 —— 见 body 的 padding-bottom。
       改这两个值不用再去别处同步数字。 */
    --site-qr-size: 64px;
    --site-qr-gap: 22px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100dvh;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    /* 底部留白必须让开「整馆二维码」这个固定元素，否则滚到底时它会压住
       最后一排卡片的二维码按钮 —— 两个都是二维码按钮，功能还冲突。
       计算方法：留白 = 二维码尺寸 + 二维码离底距离 + 净空。
       这里不再用固定的 34px：34px 只够"喘口气"，不够"避让"。 */
    padding:
      calc(env(safe-area-inset-top, 0px) + 22px)
      calc(env(safe-area-inset-right, 0px) + 20px)
      calc(env(safe-area-inset-bottom, 0px) + var(--site-qr-size) + var(--site-qr-gap) + 12px)
      calc(env(safe-area-inset-left, 0px) + 20px);
    overflow-x: hidden;
  }
  /* 页头：左＝标题（带装饰面），右＝刷新按钮，与网格右边缘对齐 */
  header {
    max-width: 1280px;
    margin: 0 auto 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: clamp(12px, 2vw, 24px);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: clamp(10px, 1.4vw, 14px);
    min-width: 0;
  }
  /* 装饰面：藏书印风格的圆角方块，内嵌一本翻开的书 */
  .brand-mark {
    flex: none;
    width: clamp(40px, 5vw, 50px);
    height: clamp(40px, 5vw, 50px);
    border-radius: clamp(12px, 1.5vw, 15px);
    background: linear-gradient(148deg, #dd8447 0%, #c8622a 52%, #a84b1c 100%);
    color: #fff;
    display: grid;
    place-items: center;
    box-shadow:
      0 10px 20px -10px rgba(150, 70, 25, .85),
      inset 0 1px 0 rgba(255, 255, 255, .42),
      inset 0 -1px 0 rgba(88, 38, 8, .28);
  }
  .brand-mark svg { width: 56%; height: 56%; }
  h1 {
    position: relative;
    margin: 0 0 2px;
    padding-bottom: 8px;
    font-size: clamp(1.45rem, 3.4vw, 2.1rem);
    line-height: 1.15;
    font-weight: 700;
    letter-spacing: .02em;
    color: var(--ink);
  }
  /* 标题下的收锋笔触：从实到虚，收在字的右端 */
  h1::after {
    content: "";
    position: absolute;
    left: 1px;
    right: 4px;
    bottom: 0;
    height: 5px;
    border-radius: 999px;
    background: linear-gradient(90deg,
      var(--accent) 0%,
      rgba(200, 98, 42, .62) 46%,
      rgba(200, 98, 42, .22) 78%,
      rgba(200, 98, 42, 0) 100%);
  }
  .refresh {
    flex: none;
    width: 52px;
    height: 52px;
    border: 0;
    border-radius: 50%;
    background: #fffdf8;
    color: var(--accent);
    box-shadow:
      0 2px 10px rgba(43, 38, 32, .15),
      inset 0 0 0 1px var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .refresh:active { transform: scale(.93); }
  .refresh svg { width: 23px; height: 23px; }
  /* 刷新反馈：仅装饰，不参与任何显隐逻辑，冻结也无副作用 */
  .refresh.is-busy { background: var(--accent); color: #fff; }
  .refresh.is-busy svg { animation: spin .55s linear; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  /* 内嵌阅读层：作品在页内打开，返回按钮由作品馆自己控制，不依赖浏览器导航
     （同样不做淡入动画，保证点击后立刻可见） */
  .reader {
    position: fixed;
    inset: 0;
    z-index: 80;
    background: #fffdfa;
  }
  .reader iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #fff;
  }
  .reader-back {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 28px);
    left: calc(env(safe-area-inset-left, 0px) + 12px);
    z-index: 2;
    padding: 15px 22px;
    border: 0;
    border-radius: 999px;
    background: rgba(255, 255, 255, .94);
    color: var(--accent-deep);
    box-shadow: 0 4px 18px rgba(168, 75, 28, .35);
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-size: 17px;
    font-weight: 600;
    -webkit-tap-highlight-color: transparent;
  }
  .reader-back:active { transform: scale(.93); }
  .reader-back svg { width: 22px; height: 22px; }
  .reader-open {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 22px);
    right: calc(env(safe-area-inset-right, 0px) + 16px);
    z-index: 2;
    width: 56px;
    height: 56px;
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, .86);
    color: var(--ink-soft);
    box-shadow: 0 3px 12px rgba(43, 38, 32, .22);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .reader-open:active { transform: scale(.93); }
  .reader-open svg { width: 26px; height: 26px; }

  .grid {
    max-width: 1280px;
    margin: 0 auto;
    display: grid;
    gap: clamp(14px, 2vw, 22px);
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  @media (min-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 1360px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

  .card {
    position: relative;
    background: #fffdf8;
    border-radius: 10px;
    overflow: hidden;
    /* 底部四层错位阴影 = 书页堆叠的书口厚度 */
    box-shadow:
      0 1px 2px rgba(43, 38, 32, .22),
      0 20px 32px -18px rgba(43, 38, 32, .58),
      0 3px 0 -1px #fffdf8,
      0 7px 0 -2px #f2e9da,
      0 11px 0 -3px #e6dbc7,
      0 15px 0 -4px #d9cbb2;
  }
  .card-open {
    display: block;
    color: inherit;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .card-open:active { transform: scale(.985); }
  .card-open, .card-open * { transition: transform .12s ease; }
  .thumb {
    position: relative;
    aspect-ratio: 3 / 4;
    background: var(--accent-soft);
    overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 书脊：左边缘的暗部渐变 */
  .thumb::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 20px;
    z-index: 2;
    background: linear-gradient(90deg,
      rgba(32, 21, 9, .62) 0,
      rgba(38, 26, 12, .34) 42%,
      rgba(38, 26, 12, .1) 72%,
      rgba(255, 255, 255, 0) 100%);
    box-shadow: inset -1px 0 0 rgba(255, 255, 255, .38);
  }
  /* 书口：右边缘的纸页纹 */
  .thumb::after {
    content: "";
    position: absolute;
    inset: 0 0 0 auto;
    width: 16px;
    z-index: 2;
    background: repeating-linear-gradient(180deg, #fffdf8 0 3px, #e9ddc9 3px 4px);
    box-shadow: inset 4px 0 6px rgba(60, 45, 25, .22);
  }
  .thumb-empty {
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft); font-size: 2.4rem;
  }
  /* 书名区：卡片左上角的实白底标签，内含书名一行。
     四角各司其职：左上书名 / 右上序号 / 左下创作日期 / 右下二维码按钮。
     每块只承担一件事，扫一眼就知道去哪找什么。 */
  .caption {
    position: absolute;
    z-index: 3;
    /* 左移 8px（26 → 18）：书名可用宽度直接多 8px */
    left: 18px;
    top: 16px;
    /* 右侧避让右上角的书签：书签 22px（贴右边缘）+ 4px 净空 = 26px。
       **这个值直接决定「书名最多几个字」** —— 430pt 档每多 14.4px 就多一个汉字。
       横向占用 → 单行字数实测（13 档 sweep 得到）：
         占 38px：375/393 档 6 字、414 档 7 字、430 档 8 字
         占 26px：375/393 档 7 字、414 档 8 字、430 档 9 字
       所以序号从 34px 的圆形角标换成 22px 的书签后，上限就从 6 字提到 7 字。
       改这个值（或改书签尺寸、标签内边距）必须重跑全档字数实测。 */
    right: 26px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    min-width: 0;
  }
  .card-tag {
    display: block;
    max-width: 100%;
    background: #fffdf8;
    border-radius: 11px;
    /* 水平内边距 9 → 7px：一个标签左右各让 2px，书名就多 4px 可用宽度 */
    padding: 6px 7px 7px;
    box-shadow: 0 1px 5px rgba(43, 38, 32, .15);
    box-sizing: border-box;
  }
  /* 书名：标签内唯一内容，独占一行。
     不设 nowrap —— 万一超过字数上限，宁可折两行，也不要溢出被卡片裁掉。 */
  .card-tag h2 {
    margin: 0;
    font-size: clamp(.9rem, 1.8vw, 1.08rem);
    line-height: 1.25;
    font-weight: 600;
    color: var(--ink);
  }
  /* 右上角序号：书签造型 —— 贴卡片右边缘、从顶边垂下、底部燕尾缺口。
     为什么是书签：① 语义对（绘本馆里「第 N 册」本来就该像书签，不是圆点）；
     ② 形状薄（22px vs 圆形角标的 34px 横向占用），直接给书名多让出一个汉字的宽度；
     ③ 贴右边缘像「夹在书页里露出的那截」，四张卡的书签永远同一位置。
     底色是**淡橙**（--accent-tint），不是实橙：
       实橙会让书签成为卡片上最重的色块，把序号抬得比书名还抢眼 ——
       这和当年那个 40% 黑底日期胶囊是同一个错误。
       淡橙给到「看得出颜色、但仍是配角」，并与白底书名标签形成区分
       （两块原来都是白底，容易糊成一片）。
     数字用 --accent-deep（深橙）而非 --accent：淡橙底上橙数字只 3.35:1，偏弱；
       深橙实测 4.75:1，过小字 4.5:1 门槛。
     贴 top:0 right:0，右上角由卡片自身的 border-radius 裁成圆弧，形成「从书页边缘露出」的效果。
     只读不可点，不适用 52px 触摸目标。 */
  .card-bookmark {
    position: absolute;
    z-index: 3;
    right: 0;
    top: 0;
    width: 22px;
    height: 44px;
    background: var(--accent-tint);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 74%, 0 100%);
    color: var(--accent-deep);
    font-size: .7rem;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    display: flex;
    justify-content: center;
    padding-top: 9px;
    box-sizing: border-box;
  }
  /* 左下角创作日期：最次要的信息。
     降级只靠字号 + 灰度，**不加底衬** —— 给它一个色块就等于把最不重要的信息抬到最显眼。
     压在插画上，用多层白晕把字从背景里剥出来。 */
  .card-date {
    position: absolute;
    z-index: 3;
    left: 18px;
    bottom: 19px;
    font-size: .62rem;
    font-weight: 400;
    letter-spacing: .02em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    /* 用色板里已有的次要灰（--ink-soft），不硬编码新灰。
       别比这更淡：日期常落在插画的亮部（草地、花丛），白晕在亮底上没有对比，
       再淡一档就从「次要」变成「看不见」—— 弱化不等于让信息消失。 */
    color: var(--ink-soft);
    /* 四层白晕：内核两层收紧（2/4px）压出字的边缘，外层两层铺开（8/12px）把
       整块区域提亮。三层时（3/6/11px）在插画的亮部（草地、花丛）仍会被冲淡。 */
    text-shadow:
      0 0 2px #fffdf8,
      0 0 4px #fffdf8,
      0 0 8px #fffdf8,
      0 0 12px rgba(255, 253, 248, .9);
  }
  /* 卡片右下角：只剩二维码按钮。
     偏移量按「视觉圆的外缘」定，不按按钮盒 —— 圆的大小变化不影响它的落点。
     = 目标外缘距边 − (触摸盒 − 视觉圆) / 2 */
  .card-foot {
    position: absolute;
    z-index: 3;
    right: 12px;    /* 22 − (52 − 32) / 2 → 圆右缘停在距卡片右边 22px */
    bottom: 0px;    /* 10 − (52 − 32) / 2 → 圆下缘停在距卡片下边 10px。
                       这里是**下限**：卡片 overflow:hidden，按钮盒底边已经贴住卡片底边，
                       再往下移会连点击区一起裁掉。想继续下移只能缩按钮盒。 */
    display: flex;
    align-items: center;
  }

  /* 视觉圆与点击区解耦：看得见的圆 32px，按钮盒仍是 52px ——
     手指够得着的范围一点没小。
     缩小的应该是「看见的那圈」，不是「能点的范围」：
     32px 远低于 44px 的最小触摸目标，直接缩按钮盒会让小孩点偏。 */
  .qr-btn {
    position: relative;
    flex: none;
    width: var(--tap);
    height: var(--tap);
    border: 0;
    padding: 0;
    background: transparent;
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .qr-btn::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 32px;
    height: 32px;
    margin: -16px 0 0 -16px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .94);
    /* 阴影随圆一起收（10 → 8px）：10px 的模糊在 39px 圆上是直径的 26%，
       放到 32px 圆上就是 31%，小圆会被自己的光晕糊住。 */
    box-shadow: 0 2px 8px rgba(43, 38, 32, .16);
  }
  .qr-btn:active { transform: scale(.94); }
  /* 图标**不跟着缩**：始终保持 13.5px。
     圆从 39 收到 32，图形/圆的比例 0.35 → 0.42 —— 圆变小、图形不变大不变小，
     看上去是「环变窄了」，不是「整颗按钮变小了」。 */
  .qr-btn svg { position: relative; z-index: 1; width: 13.5px; height: 13.5px; }

  /* 极窄机（≤360px）：卡片仅 133~153px。
     标题收一档避免折行；左下日期与右下二维码按钮在 133px 卡片上会横向打架
     （实测 320 档 x 区间重叠 10px），按钮缩到 46px、日期缩字号并左移才错得开。
     本块必须排在 .qr-btn / .card-date / .card-tag h2 的**基础规则之后** ——
     媒体查询不提升优先级，写在前面会被后面的基础规则盖掉（已踩过一次）。 */
  @media (max-width: 360px) {
    .card-tag h2 { font-size: .84rem; }
    .card-date { left: 12px; font-size: .54rem; }
    /* 与基础规则同一套算法：偏移按「视觉圆外缘」定。
       原 46px 圆贴右 14px；圆收到 32px 而盒子仍 46px，
       盒子右偏要减掉 (46 − 32) / 2 = 7px，圆的外缘才停在原处。 */
    .card-foot { right: 7px; }
    .qr-btn { width: 46px; height: 46px; }
  }

  /* ---------- 右侧下拉条（自绘，不用系统滚动条） ----------
     不直接用系统滚动条，是因为两头都不受控：
     ① iOS / iPadOS Safari 至今**完全忽略** ::-webkit-scrollbar 与 scrollbar-width，
        没有 polyfill 能绕过 —— 在 iPad 上改系统滚动条的粗细是白费功夫；
     ② 桌面端滚动条的显隐与粗细由系统「显示滚动条」设置决定（可能是一条 15px 的粗条，
        也可能完全不显示），页面说了不算。
     自绘一条：粗细、位置、显隐全部由页面定，各端表现一致。
     自绘之前必须先把系统那条藏掉，否则桌面端会并排出现两条。 */
  html { scrollbar-width: none; }                        /* Firefox / 新标准 */
  html::-webkit-scrollbar,
  body::-webkit-scrollbar { width: 0; height: 0; }       /* Chrome / Safari / Edge / Android */

  .scroll-rail {
    position: fixed;
    z-index: 44;                       /* 低于整馆二维码（45），不抢它的层 */
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    right: calc(env(safe-area-inset-right, 0px) + 4px);
    width: 3px;
    border-radius: 3px;
    /* 极淡的轨道：给「这里还能往下」一个静态提示。淡到近乎无感，不打扰插画 */
    background: rgba(43, 38, 32, .05);
    opacity: 0;
    pointer-events: none;              /* 纯指示元素，不吃点击、不挡卡片 */
  }
  /* 不做淡入过渡：过渡动画在后台标签页会被冻结，宁可硬切也不要出现
     「该显示时不可见」的状态（页内浮层已经踩过这个坑）。 */
  .scroll-rail.is-on { opacity: 1; }
  .scroll-thumb {
    display: block;
    width: 100%;
    min-height: 40px;                  /* 兜底：页面极长时滑块也不会细成一条线 */
    border-radius: inherit;
    background: rgba(43, 38, 32, .24);
  }
  /* 阅读层是不透光的整屏且 z-index 更高，会自然盖住它 */
  /* 整个作品馆的二维码：固定在画面右下角 */
  .site-qr {
    position: fixed;
    right: calc(env(safe-area-inset-right, 0px) + var(--site-qr-gap));
    bottom: calc(env(safe-area-inset-bottom, 0px) + var(--site-qr-gap));
    z-index: 45;
    width: var(--site-qr-size);
    height: var(--site-qr-size);
    border: 0;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    box-shadow: 0 8px 22px -6px rgba(120, 60, 20, .55);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .site-qr:active { transform: scale(.93); }
  .site-qr svg { width: 30px; height: 30px; }

  /* 二维码浮层（不做淡入动画：过渡在后台/异常环境下会被冻结，出现"点了不出来"） */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(30, 26, 22, .5);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding:
      calc(env(safe-area-inset-top, 0px) + 20px)
      20px
      calc(env(safe-area-inset-bottom, 0px) + 20px);
  }
  .sheet {
    position: relative;
    width: min(92vw, 420px);
    max-height: 100%;
    overflow: auto;
    background: #fffdfa;
    border-radius: 26px;
    padding: 26px 24px 22px;
    text-align: center;
    box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .5);
  }
  .sheet h3 { margin: 0 0 16px; font-size: 1.18rem; line-height: 1.35; }
  .qr-frame {
    background: #f7f5f0;
    border-radius: 18px;
    padding: 14px;
    display: inline-block;
    line-height: 0;
    margin-bottom: 14px;
  }
  .qr-frame img {
    width: min(60vw, 300px);
    height: auto;
    display: block;
    image-rendering: crisp-edges;
  }
  .close-x {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 52px;
    height: 52px;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font-size: 1.7rem;
    line-height: 1;
    cursor: pointer;
    border-radius: 50%;
    -webkit-tap-highlight-color: transparent;
  }
  .close-x:active { background: var(--accent-soft); }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 54px;
    padding: 0 26px;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { filter: brightness(.94); }
  .empty { color: var(--ink-soft); text-align: center; padding: 8vh 0; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 6.4C10.6 5 8.6 4.3 6.2 4.3H3.8v13.4h2.4c2.4 0 4.4.7 5.8 2.1 1.4-1.4 3.4-2.1 5.8-2.1h2.4V4.3h-2.4c-2.4 0-4.4.7-5.8 2.1z"/>
        <path d="M12 6.4v13.4"/>
      </svg>
    </span>
    <h1>峻峻的作品馆</h1>
  </div>
  <button class="refresh" id="refresh" type="button" aria-label="刷新作品列表">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3.8 12a8.2 8.2 0 0 1 14-5.8"/>
      <path d="M18.2 3.4v4.4h-4.4"/>
      <path d="M20.2 12a8.2 8.2 0 0 1-14 5.8"/>
      <path d="M5.8 20.6v-4.4h4.4"/>
    </svg>
  </button>
</header>

<main id="grid" class="grid" aria-live="polite"></main>

<!-- 右侧下拉条：自绘，各端一致。aria-hidden —— 纯视觉指示，
     滚动位置由屏幕阅读器自己播报，不该被重复读一遍 -->
<div class="scroll-rail" id="scroll-rail" aria-hidden="true"><span class="scroll-thumb"></span></div>

<button class="site-qr" id="site-qr" aria-label="显示作品馆二维码" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/>
    <rect x="3" y="14" width="7" height="7" rx="1.6"/><path d="M14 14h3v3h-3z"/>
    <path d="M19.5 14H21v1.5"/><path d="M14 19.5V21h1.5"/><path d="M19.5 19.5H21V21"/>
  </svg>
</button>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="qr-title" hidden>
  <div class="sheet">
    <button class="close-x" id="qr-x" aria-label="关闭二维码">×</button>
    <h3 id="qr-title">作品</h3>
    <div class="qr-frame"><img id="qr-img" alt="作品二维码"></div>
    <button class="btn" id="qr-close">关闭</button>
  </div>
</div>

<div class="reader" id="reader" hidden>
  <iframe id="reader-frame" title="作品内容" allow="autoplay; fullscreen; accelerometer; gyroscope" allowfullscreen></iframe>
  <button class="reader-back" id="reader-back" aria-label="回到作品馆">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>返回
  </button>
  <button class="reader-open" id="reader-external" aria-label="在浏览器中打开这个作品">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 19V8a1.5 1.5 0 0 1 1.5-1.5H10"/></svg>
  </button>
</div>

<script>
(function () {
  "use strict";
  var grid = document.getElementById("grid");
  var overlay = document.getElementById("overlay");
  var qrImg = document.getElementById("qr-img");
  var qrTitle = document.getElementById("qr-title");
  var lastTrigger = null;

  var QR_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/>'
    + '<rect x="3" y="14" width="7" height="7" rx="1.6"/><path d="M14 14h3v3h-3z"/><path d="M19.5 14H21v1.5"/>'
    + '<path d="M14 19.5V21h1.5"/><path d="M19.5 19.5H21V21"/></svg>';

  function openQr(work, trigger) {
    lastTrigger = trigger || null;
    qrTitle.textContent = work.title;
    qrImg.src = work.qr;
    qrImg.alt = work.title + " 二维码";
    overlay.hidden = false;
    document.getElementById("qr-close").focus({ preventScroll: true });
  }

  function closeQr() {
    if (overlay.hidden) return;
    overlay.hidden = true;
    qrImg.removeAttribute("src");
    if (lastTrigger && document.contains(lastTrigger)) lastTrigger.focus({ preventScroll: true });
  }

  document.getElementById("qr-close").addEventListener("click", closeQr);
  document.getElementById("qr-x").addEventListener("click", closeQr);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeQr(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeQr(); });

  /* ---------- 内嵌阅读层 ----------
     作品在页内打开，左上角一个显性的大返回按钮。
     不依赖浏览器导航栏 —— 加到主屏后是全屏无地址栏的，小朋友靠浏览器返回键回不来。 */
  var reader = document.getElementById("reader");
  var frame = document.getElementById("reader-frame");
  var readerBack = document.getElementById("reader-back");
  var readerUrl = "";

  /* 绘本页看到这个 hash 会跳过自己的封面页，直接进故事正文 ——
     书名已经叠在卡片上了，再走一遍封面是多余的。
     单独扫码或直接打开链接时不带这个 hash，照旧先显示封面。
     用 hash 而不是 query：豆包对不带尾斜杠的地址做 301，会丢掉 search，只有 hash 能活着到达页面。 */
  var ENTRY_HASH = "#from-gallery";
  function withEntryFlag(url) {
    if (!url) return url;
    return url.split("#")[0] + ENTRY_HASH;
  }

  function openReader(work) {
    readerUrl = work.onlineUrl || work.localUrl;
    frame.src = withEntryFlag(readerUrl);
    reader.hidden = false;
    readerBack.hidden = false;   // 先按兜底显示；作品自带返回时会通知收起
    document.body.style.overflow = "hidden";
    syncRail();   // 阅读层占满整屏，下拉条该收起来
    readerBack.focus({ preventScroll: true });
  }

  function closeReader() {
    if (reader.hidden) return;
    reader.hidden = true;
    frame.removeAttribute("src"); // 断开引用，把里面的声音一起停掉
    readerUrl = "";
    document.body.style.overflow = "";
    syncRail();   // 回到列表，按当前滚动位置重新显示
  }

  /* 绘本自带的「返回」按钮会通知这里：
     - reader-has-back：这本书自己左上角有返回，收起作品馆那个，避免两个按钮叠在一起；
     - close-reader：把阅读层关掉（在 iframe 里时绘本没有浏览器返回键可用）。
     老作品不发消息，作品馆这个按钮照旧兜底。 */
  window.addEventListener("message", function (e) {
    if (e.source !== frame.contentWindow) return;
    var d = e.data;
    if (!d || d.type !== "junjun-gallery") return;
    if (d.action === "reader-has-back") readerBack.hidden = true;
    else if (d.action === "close-reader") closeReader();
  });

  readerBack.addEventListener("click", closeReader);
  /* 「在浏览器中打开」算单独进入：给不带 hash 的原始地址，让作品页正常显示封面 */
  document.getElementById("reader-external").addEventListener("click", function () {
    if (readerUrl) window.open(readerUrl, "_blank", "noopener");
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeReader(); });

  /* 右下角的整馆二维码：扫一次直接进作品馆 */
  var siteQrEl = document.getElementById("site-qr");
  var siteQrPath = "";
  siteQrEl.addEventListener("click", function () {
    if (!siteQrPath) return;
    openQr({ title: "峻峻的作品馆", qr: siteQrPath, onlineUrl: "" }, siteQrEl);
  });

  /* ---------- 右侧下拉条 ----------
     系统滚动条在 iPad 上不可定制（见 CSS 段的说明），所以位置与长度全部自己算：
     滑块长度 = 轨道长 × 视口高 / 文档高，滑到哪里 = 轨道余长 × 已滚比例。
     纯指示元素，不接管任何交互；滚动/改窗口/内容变高三种情况都要重算。 */
  var rail = document.getElementById("scroll-rail");
  var railThumb = rail.querySelector(".scroll-thumb");

  function syncRail() {
    /* 阅读层占满整屏、且把页面滚动锁了，此时下拉条没有意义 */
    if (!reader.hidden) { rail.classList.remove("is-on"); return; }
    var doc = document.documentElement;
    var viewH = doc.clientHeight;
    var fullH = doc.scrollHeight;
    var max = fullH - viewH;
    /* 不足一屏就没得滚 —— 留 24px 容差，避免「只多出十几像素」时也挂一条滑块 */
    if (max <= 24) { rail.classList.remove("is-on"); return; }
    rail.classList.add("is-on");
    var railH = rail.clientHeight;
    var th = Math.max(40, Math.round(railH * viewH / fullH));
    /* iOS 回弹时 pageYOffset 会变成负数，夹住再算，滑块才不会跑出轨道 */
    var y = Math.round((railH - th) * Math.min(max, Math.max(0, window.pageYOffset)) / max);
    railThumb.style.height = th + "px";
    railThumb.style.transform = "translateY(" + y + "px)";
  }

  window.addEventListener("scroll", syncRail, { passive: true });
  window.addEventListener("resize", syncRail);
  window.addEventListener("orientationchange", function () { setTimeout(syncRail, 120); });
  /* 内容高度会变（作品增减、列表重载），光靠 scroll/resize 抓不到 */
  if (window.ResizeObserver) new ResizeObserver(syncRail).observe(document.body);

  function card(work, index) {
    var el = document.createElement("article");
    el.className = "card";

    /* 册号：优先用 meta.json 的 order —— 编号固定，新增作品不会把已有编号挤走；
       没有 order 时退回展示顺序。只写数字本身，不带单位前缀。 */
    var seq = typeof work.order === "number" ? work.order : index + 1;
    var seqText = String(seq);

    var link = document.createElement("a");
    link.className = "card-open";
    // 线上优先：iPad 与本机不在同一个 Wi-Fi，所以作品统一走公网地址。
    // href + target 只作为兜底（JS 失效时长按或新窗口仍能打开），正常点击走页内阅读层。
    link.href = work.onlineUrl || work.localUrl;
    link.target = "_blank";
    link.rel = "noopener";
    link.setAttribute("aria-label", "打开第 " + seq + " 册《" + work.title + "》");
    link.addEventListener("click", function (e) {
      e.preventDefault();
      openReader(work);
    });

    var thumb = document.createElement("div");
    thumb.className = "thumb";
    if (work.cover) {
      var img = document.createElement("img");
      img.src = work.cover;
      img.alt = "";
      img.loading = "lazy";
      thumb.appendChild(img);
    } else {
      thumb.classList.add("thumb-empty");
      thumb.textContent = "◆";
    }

    var caption = document.createElement("div");
    caption.className = "caption";

    var tag = document.createElement("div");
    tag.className = "card-tag";
    var h2 = document.createElement("h2");
    h2.textContent = work.title;
    tag.appendChild(h2);
    caption.appendChild(tag);
    thumb.appendChild(caption);

    /* 右上角：序号书签。
       序号已在卡片的 aria-label（「打开第 N 册《…》」）里念过，这里标 aria-hidden
       避免屏幕阅读器重复朗读同一个信息。 */
    var no = document.createElement("span");
    no.className = "card-bookmark";
    no.textContent = seqText;
    no.setAttribute("aria-hidden", "true");
    thumb.appendChild(no);

    /* 左下角：创作日期（最次要信息） */
    if (work.created) {
      var when = document.createElement("time");
      when.className = "card-date";
      when.textContent = work.created;
      thumb.appendChild(when);
    }

    link.appendChild(thumb);
    el.appendChild(link);

    /* 右下角：只剩二维码按钮 */
    var foot = document.createElement("div");
    foot.className = "card-foot";
    if (work.qr) {
      var btn = document.createElement("button");
      btn.className = "qr-btn";
      btn.type = "button";
      btn.innerHTML = QR_ICON;
      btn.setAttribute("aria-label", "显示《" + work.title + "》的二维码");
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        openQr(work, btn);
      });
      foot.appendChild(btn);
    }
    el.appendChild(foot);
    return el;
  }

  function render(data) {
    var works = data.works || [];
    siteQrPath = data.siteQr || "";
    siteQrEl.hidden = !siteQrPath;
    grid.textContent = "";
    if (!works.length) {
      var p = document.createElement("p");
      p.className = "empty";
      p.textContent = "还没有作品，先让豆包做一本吧。";
      grid.appendChild(p);
      return;
    }
    var frag = document.createDocumentFragment();
    works.forEach(function (w, i) { frag.appendChild(card(w, i)); });
    grid.appendChild(frag);
  }

  /* bust=true 时带时间戳绕开缓存 —— 刷新按钮的落点 */
  function load(bust) {
    var url = "works.json" + (bust ? "?t=" + Date.now() : "");
    return fetch(url, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(render)
      .then(syncRail)
      .catch(function (err) {
        grid.textContent = "";
        var p = document.createElement("p");
        p.className = "empty";
        p.textContent = "作品列表没读出来（" + err.message + "），确认服务在跑，然后刷新一下。";
        grid.appendChild(p);
        syncRail();
      });
  }

  /* 首屏刷新按钮：加到主屏后没有地址栏，下拉刷新不可用，只能给个显式按钮 */
  var refreshBtn = document.getElementById("refresh");
  refreshBtn.addEventListener("click", function () {
    if (refreshBtn.classList.contains("is-busy")) return;
    refreshBtn.classList.add("is-busy");
    setTimeout(function () { refreshBtn.classList.remove("is-busy"); }, 700);
    closeReader();
    closeQr();
    grid.style.opacity = ".45";
    load(true).then(function () { grid.style.opacity = ""; });
  });

  load(false);
})();
</script>
</body>
</html>
